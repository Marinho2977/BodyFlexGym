<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | Bodyflex Gym</title>
  <meta name="description" content="La página que buscas no existe o ha sido movida. Vuelve al inicio de Bodyflex Gym.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: rgba(255,255,255,0.08);
      --accent: #FF6B00;
      --accent-glow: rgba(255,107,0,0.35);
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .bg-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,107,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      height: 68px;
      padding: 0 48px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .nav-btn:hover { color: #fff; }

    /* 404 CONTENT HERO */
    .error-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .error-number {
      font-family: 'Syne', sans-serif;
      font-size: clamp(100px, 18vw, 180px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -6px;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,107,0,0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 0 80px rgba(255,107,0,0.2);
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,107,0,0.1);
      border: 1px solid rgba(255,107,0,0.25);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    .error-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: #fff;
    }

    .error-desc {
      font-size: 16px;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .actions-grid {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s;
      border: none;
      box-shadow: 0 4px 20px rgba(255,107,0,0.3);
    }
    .btn-primary:hover {
      background: #FF8C42;
      box-shadow: 0 0 32px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255,107,0,0.06);
      transform: translateY(-2px);
    }

    .footer-simple {
      padding: 24px 48px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      position: relative;
      z-index: 10;
    }

    @media (max-width: 600px) {
      .topbar { padding: 0 20px; }
      .actions-grid { flex-direction: column; width: 100%; }
      .btn-primary, .btn-secondary { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- TOPBAR -->
  <header class="topbar">
    <a href="/" class="logo">BODYFLEX<span>GYM</span></a>
  </header>

  <!-- MAIN ERROR -->
  <main class="error-container" id="main404Content">
    <div class="error-badge"> Error 404</div>
    <div class="error-number">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">
      Lo sentimos, la ruta que estás intentando consultar no existe o ha sido trasladada. Revisa la URL o regresa al inicio.
    </p>

    <div class="actions-grid">
      <a href="/" class="btn-primary">Ir a la Página Principal</a>
    </div>
  </main>
</body>
</html>
